<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Σ SIGMA</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:linear-gradient(160deg,#060010 0%,#0d0020 40%,#080818 100%);color:#d0c0f0;font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;padding:12px 10px;overflow-x:hidden}
main{max-width:680px;margin:0 auto}
.hdr{text-align:center;padding:20px 0 12px;border-bottom:2px solid rgba(148,0,211,.25);margin-bottom:12px}
.hdr h1{font-size:27px;font-weight:900;letter-spacing:3px;background:linear-gradient(135deg,#9400d3,#c471ed,#9400d3);-webkit-background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 15px rgba(148,0,211,.4))}
.hdr p{color:#604080;font-size:10px;margin-top:3px;letter-spacing:2px}
.sts{display:flex;align-items:center;gap:8px;background:rgba(148,0,211,.08);border-radius:8px;padding:8px 12px;margin-bottom:10px;border:1px solid rgba(148,0,211,.15)}
.sts .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.sts .dot.on{background:#9400d3;box-shadow:0 0 10px #9400d3}
.sts .dot.off{background:#e74c3c}
.sts span{font-size:10px}.sts span.on{color:#c471ed}.sts span.off{color:#e74c3c}
.sec{margin-bottom:14px}
.sec .lbl{font-size:9px;text-transform:uppercase;letter-spacing:2.5px;color:#9400d3;margin-bottom:6px;padding-left:4px;font-weight:700;display:flex;align-items:center;gap:6px}
.sec .lbl .tag{font-size:7px;padding:2px 7px;border-radius:10px;background:rgba(148,0,211,.12);color:#c471ed;border:1px solid rgba(148,0,211,.2);letter-spacing:0}
.g1{display:grid;grid-template-columns:1fr;gap:5px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px}
.g4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:5px}
.g5{display:grid;grid-template-columns:1fr 1fr 1fr 1fr 1fr;gap:5px}
.g7{display:grid;grid-template-columns:1fr 1fr 1fr 1fr 1fr 1fr 1fr;gap:5px}
.btn{all:unset;box-sizing:border-box;width:100%;padding:10px 6px;border-radius:8px;cursor:pointer;font-weight:600;font-size:10px;text-align:center;background:rgba(148,0,211,.08);border:1px solid rgba(148,0,211,.12);color:#d4b8e8;transition:all .15s;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.2px;display:flex;flex-direction:column;align-items:center;gap:3px}
.btn:hover{transform:translateY(-2px);background:rgba(148,0,211,.18);border-color:rgba(148,0,211,.3);box-shadow:0 4px 20px rgba(148,0,211,.15)}
.btn:active{transform:scale(.95)}
.btn .ico{font-size:15px;line-height:1;display:block}
.bg{background:rgba(46,204,113,.08);border-color:rgba(46,204,113,.16);color:#b8e6cc}.bg:hover{background:rgba(46,204,113,.16);border-color:rgba(46,204,113,.28)}
.br{background:rgba(231,76,60,.08);border-color:rgba(231,76,60,.16);color:#f0b8b8}.br:hover{background:rgba(231,76,60,.16);border-color:rgba(231,76,60,.28)}
.bb{background:rgba(52,152,219,.08);border-color:rgba(52,152,219,.16);color:#b8d8f0}.bb:hover{background:rgba(52,152,219,.16);border-color:rgba(52,152,219,.28)}
.by{background:rgba(241,196,15,.08);border-color:rgba(241,196,15,.16);color:#f0e8b0}.by:hover{background:rgba(241,196,15,.16);border-color:rgba(241,196,15,.28)}
.bo{background:rgba(230,126,34,.08);border-color:rgba(230,126,34,.16);color:#f0c8a8}.bo:hover{background:rgba(230,126,34,.16);border-color:rgba(230,126,34,.28)}
.bp{background:rgba(148,0,211,.14);border-color:rgba(148,0,211,.24);color:#e0c8f8}.bp:hover{background:rgba(148,0,211,.24)}

.crd{background:rgba(148,0,211,.04);border-radius:9px;padding:11px;margin-bottom:6px;border:1px solid rgba(148,0,211,.1)}
.crd .ttl{font-size:9px;color:#706090;margin-bottom:5px;text-transform:uppercase;letter-spacing:1px}
.row{display:flex;gap:5px;align-items:center}
input,select{flex:1;padding:9px 10px;border-radius:7px;background:rgba(148,0,211,.06);border:1px solid rgba(148,0,211,.14);color:#d4b8e8;font-size:11px;outline:none;min-width:0;font-family:inherit}
input:focus{border-color:#9400d3;box-shadow:0 0 0 3px rgba(148,0,211,.1)}
input.sm{flex:.3}
.log{background:rgba(0,0,0,.35);border-radius:8px;padding:10px;max-height:140px;overflow-y:auto;font-family:'Courier New',monospace;font-size:9px;margin-top:10px;border:1px solid rgba(148,0,211,.1)}
.log .e{padding:3px 5px;border-bottom:1px solid rgba(255,255,255,.02);color:#705090}
.log .e.ok{color:#c471ed}.log .e.er{color:#e74c3c}
.rip{animation:rip .35s ease-out}
@keyframes rip{from{box-shadow:0 0 0 0 rgba(148,0,211,.6)}to{box-shadow:0 0 0 18px rgba(148,0,211,0)}}
hr{border:none;border-top:1px solid rgba(148,0,211,.12);margin:14px 0}
.ft{text-align:center;padding:14px 0;color:#201040;font-size:8px;letter-spacing:2px}
.chips{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}
.chips .btn{width:auto;padding:6px 10px;font-size:8px;min-width:unset;flex:0 0 auto;flex-direction:row;gap:0}
</style>
</head>
